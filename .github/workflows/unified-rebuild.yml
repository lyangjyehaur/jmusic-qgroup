name: Unified rebuild checkpoint
on: [push, pull_request]
jobs:
  isolated-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - run: npm run check:capabilities
      - run: npm run check:ui
      # Fixture construction launches original Python readers and verifies whole
      # SQLite images. A complete Linux report confirmed 55 default 5s timeouts;
      # allow bounded fixture assembly time while preserving every assertion.
      - run: mkdir -p artifacts/ci
      - name: Verify generated request contracts and export schema references
        run: |
          npm run check:http-contracts:rebuild
          reference_output="$RUNNER_TEMP/qgroup-http-contracts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          npx tsx tools/rebuild/build-http-contracts.ts --output "$reference_output" > artifacts/ci/http-contracts-receipt.json
          cp "$reference_output/schemas.json" artifacts/ci/http-schemas.json
          cp "$reference_output/request-operations.json" artifacts/ci/http-request-operations.json
          cp "$reference_output/openapi.json" artifacts/ci/http-openapi.json
      - name: Fetch immutable original source for differential unit tests
        run: git fetch --no-tags origin 8da877857f163853c449474e168534e2e493121b 07defc429d619a7558ab7218372886f531813ae3
      - run: npm run test:rebuild -- --maxWorkers=1 --testTimeout=30000 --reporter=default --reporter=json --outputFile=artifacts/ci/unit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-unit-evidence
          path: artifacts/ci/
          if-no-files-found: warn
  isolated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:rebuild
      - run: npm run test:build:rebuild
      - name: Verify compiled web with the fixed original Python bot
        run: |
          git fetch --no-tags origin 8da877857f163853c449474e168534e2e493121b
          mkdir -p artifacts/ci
          npm run test:retained-python:rebuild --silent > artifacts/ci/retained-python.json
      - name: Verify original settlement recovery with compiled web and retained Python bot
        run: npm run test:legacy-settlement:rebuild --silent > artifacts/ci/legacy-settlement-pair.json
      - name: Verify original time-poll recovery with compiled web and retained Python bot
        run: npm run test:legacy-time-poll:rebuild --silent > artifacts/ci/legacy-time-poll-pair.json
      - name: Verify original activity creation with compiled web and the observed bot source
        run: |
          git fetch --no-tags origin 07defc429d619a7558ab7218372886f531813ae3
          npm run test:legacy-activity-create:rebuild --silent > artifacts/ci/legacy-activity-create-pair.json
      - name: Verify original activity changes with the observed Python bot source
        run: npm run test:legacy-activity-patch:rebuild --silent > artifacts/ci/legacy-activity-patch-pair.json
      - name: Verify original roster recovery with the observed Python bot source
        run: npm run test:legacy-registration:rebuild --silent > artifacts/ci/legacy-registration-pair.json
      - name: Verify original invitation and delegation recovery with the observed Python bot source
        run: npm run test:legacy-invitations:rebuild --silent > artifacts/ci/legacy-invitations-pair.json
      - name: Verify original participant claims and attendance with the observed Python bot source
        run: npm run test:legacy-participants:rebuild --silent > artifacts/ci/legacy-participants-pair.json
      - name: Verify original personal recovery with the observed Python bot source
        run: npm run test:legacy-personal:rebuild --silent > artifacts/ci/legacy-personal-pair.json

      - run: npx playwright install --with-deps chromium
      - name: Pin public analytics client for intercepted transport test
        run: |
          client_path="$RUNNER_TEMP/qgroup-public-umami-client.js"
          curl --fail --silent --show-error --max-time 30 https://u.danndann.cn/script.js --output "$client_path"
          printf '%s  %s\n' '1ad1145d19d4558c20f5469ca4a5fc50a1a46f860858c9c91bfcd56fd29a522a' "$client_path" | sha256sum --check
          printf 'REBUILD_UMAMI_CLIENT=%s\n' "$client_path" >> "$GITHUB_ENV"
      - run: mkdir -p artifacts/ci
      - run: PLAYWRIGHT_JSON_OUTPUT_FILE="$GITHUB_WORKSPACE/artifacts/ci/browser.json" npm run test:e2e:rebuild -- --forbid-only --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-browser-evidence
          path: |
            artifacts/ci/
            test-results/
          if-no-files-found: warn
  isolated-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: mkdir -p artifacts/ci
      - name: Archive exact commit for an isolated rehearsal image
        run: |
          image_output="$RUNNER_TEMP/qgroup-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          npx tsx tools/rebuild/prepare-image.ts --commit "$GITHUB_SHA" --output "$image_output" --purpose rehearsal > artifacts/ci/image-source.json
      - name: Build immutable local image from archived source
        run: |
          image_context="$RUNNER_TEMP/qgroup-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/context"
          docker build --file "$image_context/deploy/unified.Dockerfile" --build-arg "QGROUP_COMMIT=$GITHUB_SHA" --iidfile artifacts/ci/image.id "$image_context"
      - name: Verify actual Linux runtime with empty private volumes
        run: |
          image_id="$(cat artifacts/ci/image.id)"
          docker image inspect "$image_id" > artifacts/ci/image-inspect.json
          node tools/rebuild/verify-image.mjs --image "$image_id" --commit "$GITHUB_SHA" > artifacts/ci/image-verification.json
      - name: Cross-check candidate manifest against original image versions and resolved Compose
        run: |
          image_context="$RUNNER_TEMP/qgroup-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/context"
          manifest_output="$RUNNER_TEMP/qgroup-runtime-manifest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          npx tsx tools/rebuild/prepare-runtime-manifest-evidence.ts --source "$image_context" --image-report "$GITHUB_WORKSPACE/artifacts/ci/image-verification.json" --image-inspect "$GITHUB_WORKSPACE/artifacts/ci/image-inspect.json" --output "$manifest_output" > artifacts/ci/runtime-manifest-receipt.json
          cp "$manifest_output/runtime-evidence.json" artifacts/ci/runtime-evidence.json
          cp "$manifest_output/runtime-verification.json" artifacts/ci/runtime-verification.json
      - name: Verify built bot through container-local synthetic platform
        run: |
          image_context="$RUNNER_TEMP/qgroup-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/context"
          harness_dir="$RUNNER_TEMP/qgroup-bot-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          node tools/rebuild/build-image-bot-smoke.mjs --source "$image_context" --output "$harness_dir" > artifacts/ci/image-bot-harness.json
          image_id="$(cat artifacts/ci/image.id)"
          smoke_name="qgroup-ci-bot-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm -f "$smoke_name" >/dev/null 2>&1 || true' EXIT
          timeout --signal=TERM --kill-after=15s 90s docker run --rm --name "$smoke_name" --label qgroup.rehearsal=true --init --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --memory 512m --memory-swap 512m --cpus 1 --pids-limit 128 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m --mount "type=bind,src=$harness_dir,dst=/app/tools/rebuild,readonly" --entrypoint node "$image_id" /app/tools/rebuild/smoke-bot.mjs > artifacts/ci/image-bot-smoke.log
          remaining_id="$(docker container ls --all --filter "name=^/$smoke_name$" --format '{{.ID}}')"
          if [ -n "$remaining_id" ]; then
            echo 'Owned smoke container was not removed after exit' >&2
            exit 1
          fi
      - name: Build fixed original Python verification image
        run: |
          git fetch --no-tags origin 8da877857f163853c449474e168534e2e493121b
          image_context="$RUNNER_TEMP/qgroup-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/context"
          python_context="$RUNNER_TEMP/qgroup-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          node "$image_context/tools/rebuild/prepare-retained-python-image.mjs" --source "$image_context" --output "$python_context" > artifacts/ci/retained-python-image-source.json
          docker build --build-arg QGROUP_PYTHON_COMMIT=8da877857f163853c449474e168534e2e493121b --build-arg "QGROUP_VERIFICATION_COMMIT=$GITHUB_SHA" --iidfile artifacts/ci/retained-python-image.id "$python_context"
      - name: Verify actual web and original Python images together
        run: |
          image_context="$RUNNER_TEMP/qgroup-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/context"
          image_id="$(cat artifacts/ci/image.id)"
          python_id="$(cat artifacts/ci/retained-python-image.id)"
          docker image inspect "$python_id" > artifacts/ci/retained-python-image-inspect.json
          timeout --signal=TERM --kill-after=90s 900s node "$image_context/tools/rebuild/verify-retained-python-images.mjs" --web-image "$image_id" --python-image "$python_id" --commit "$GITHUB_SHA" > artifacts/ci/retained-python-image-pair.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-image-evidence
          path: artifacts/ci/
          if-no-files-found: warn
