</head><body class="policy-body"><main class="page policy-page"><nav><a href="/">返回群聚看板</a> · <a href="/privacy">隱私政策</a> · <a href="/contact">聯繫與投訴</a></nav><h1>聯繫與投訴</h1><p>群聚看板由個人運營。帳號、隱私、資料刪除及內容投訴均可聯繫：</p><p class="contact-address"><a href="mailto:203008876@qq.com">203008876@qq.com</a></p>
<h2>提交時請說明</h2><ul><li>問題類型，以及希望如何處理。</li><li>相關活動鏈接、帳號稱呼或資料刪除申請編號。</li><li>內容投訴請標明具體位置，並說明涉及的問題及必要依據。</li></ul><p>我們會通過回信核對歸屬並告知處理情況。請使用能收到回覆的郵箱，勿發送 QQ 密碼、授權碼或無關的敏感資料。</p><p>已登錄時，也可以從「個人資料 → 帳號與設備 → 隱私與資料刪除」提交註銷和刪除申請。</p></main><footer class="site-footer"><a href="https://danndann.cn" target="_blank" rel="noopener noreferrer">作者：飯糰</a><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">渝ICP备16002872号-1</a></footer></body></html>
